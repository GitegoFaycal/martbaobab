services:
  postgres:
    image: postgres:17-alpine
    container_name: loco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: martbaobab
      POSTGRES_PASSWORD: martbaobab
      POSTGRES_DB: martbaobab
    ports:
      - "5432:5432"
    volumes:
      - loco_data:/var/lib/postgresql/data
volumes:
  loco_data:
